version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G304 # путь из переменной: реестр читает файлы по путям из конфига
        - G204 # запуск процесса из argv сервера: это и есть работа прокси
        - G301
        - G302
        - G306
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Тесты поднимают наборы, пишут во временные каталоги и намеренно ломают права.
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
