name: ci
# Каждый пуш и каждый PR: формат, статика, сборка, тесты, документация, веб.
# Раньше здесь стоял только docs.yml для markdown — правка Go уезжала в master
# без единого прогона, и поломку ловил первый тег. Теги по-прежнему гоняет
# release.yml (там же govulncheck и goreleaser).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Свежий пуш отменяет прогон по тому же ref: ждать очередь незачем.
  group: mcprig-ci-${{ gitea.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.4'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Экшены прибиты к SHA: тег можно переписать, коммит — нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Формат
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: файлы не отформатированы"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Сборка
        run: go build ./...
      # -p 1 обязателен: пакеты manager и e2e делят порты 9100–9199
      - name: Тесты
        run: go test ./... -race -count=1 -p 1

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docs-check
        run: bash scripts/docs-check.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Синтаксис панели
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "в образе раннера нет node — проверка синтаксиса панели пропущена"
            exit 0
          fi
          node --check web/app.js

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Уязвимые зависимости
        run: |
          set -euo pipefail
          # proxy.golang.org на раннере иногда обрывает TLS — повторяем установку,
          # иначе сетевой флейк выглядит как провал сканера.
          ok=0
          for i in 1 2 3; do
            if go install golang.org/x/vuln/cmd/govulncheck@v1.9.0; then ok=1; break; fi
            echo "go install govulncheck: попытка $i не удалась, повтор через 15с"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "govulncheck не установился"; exit 1; }
          govulncheck ./...
