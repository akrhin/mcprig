name: release
# Тег v* → проверки (vet, тесты с -race, govulncheck, gofmt) → goreleaser: четыре
# платформы, checksums, черновик релиза в Gitea. Публикацию делает человек.
on:
  push:
    tags:
      - 'v*'

# По умолчанию — только чтение; право на релиз выдаётся одному job'у ниже.
permissions:
  contents: read

concurrency:
  # Один раннер: релизы сериализуются, новый пуш тега не отменяет идущий.
  group: mcprig-release
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.3'
  GORELEASER_VERSION: v2.20.0
  GITEA_URL: https://frosty-ad-gt.cloudpub.ru

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Экшены прибиты к SHA: тег можно переписать, коммит — нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Формат
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: файлы не отформатированы"; exit 1; }
      - name: go vet
        run: go vet ./...
      # -p 1 обязателен: пакеты manager и e2e делят порты 9100–9199
      - name: Тесты
        run: go test ./... -race -count=1 -p 1

  # Отдельная джоба: находка govulncheck не должна глушить кэш тестов
  # (setup-go сохраняет его в post-шаге под post-if: success()).
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Уязвимые зависимости
        run: |
          set -euo pipefail
          # proxy.golang.org на раннере иногда обрывает TLS — повторяем установку,
          # иначе сетевой флейк выглядит как провал сканера.
          ok=0
          for i in 1 2 3; do
            if go install golang.org/x/vuln/cmd/govulncheck@v1.9.0; then ok=1; break; fi
            echo "go install govulncheck: попытка $i не удалась, повтор через 15с"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "govulncheck не установился"; exit 1; }
          govulncheck ./...

  release:
    needs: [verify, vuln]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # создание релиза и загрузка артефактов
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # goreleaser не собирается нашим Go (нужен тулчейн новее) — берём готовый
      # бинарник, но только после сверки sha256 по их же checksums.txt.
      # Качаем в RUNNER_TEMP, а не в рабочее дерево: goreleaser падает на грязном git.
      - name: Установить goreleaser
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}/goreleaser"
          mkdir -p "$tmp"
          base="https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}"
          file="goreleaser_Linux_x86_64.tar.gz"
          for i in 1 2 3; do
            if curl -sfL --retry 3 -o "$tmp/$file" "$base/$file" && curl -sfL --retry 3 -o "$tmp/checksums.txt" "$base/checksums.txt"; then
              break
            fi
            echo "скачивание goreleaser: попытка $i не удалась, повтор через 10с"; sleep 10
          done
          # Провал скачивания не должен превращаться в невнятную ошибку sha256sum.
          test -s "$tmp/$file" && test -s "$tmp/checksums.txt" || { echo "не удалось скачать goreleaser ${GORELEASER_VERSION}"; exit 1; }
          line=$(grep " $file\$" "$tmp/checksums.txt") || { echo "в checksums.txt нет строки $file"; exit 1; }
          printf '%s\n' "$line" | (cd "$tmp" && sha256sum -c -)
          tar -xzf "$tmp/$file" -C "$tmp" goreleaser
          "$tmp/goreleaser" --version
          echo "GORELEASER_BIN=$tmp/goreleaser" >> "$GITHUB_ENV"
      # Конфиг проверяем до сборки: невалидный .goreleaser.yaml иначе уронит
      # релиз уже после публикации части артефактов.
      - name: Проверить конфиг goreleaser
        run: |
          set -euo pipefail
          if ! "$GORELEASER_BIN" check; then
            echo "goreleaser check: .goreleaser.yaml невалиден — релиз остановлен"
            exit 1
          fi
      - name: Релиз
        env:
          # Встроенный токен задачи с permissions.contents=write. Если инстанс его
          # не выдаёт — заведите секрет RELEASE_TOKEN (PAT со scope write:repository).
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          "$GORELEASER_BIN" release --clean
