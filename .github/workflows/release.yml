name: release
# Релиз на GitHub. Сборку гоняет Gitea CI по тегу (тесты, govulncheck, goreleaser
# в Gitea); здесь — те же архивы ещё раз, чтобы у GitHub-релиза были свои файлы:
# публичный репозиторий, минуты Actions бесплатны.
#
# Публикации в Gitea отсюда нет: goreleaser идёт с --skip=publish, ассеты
# загружает gh. Так .goreleaser.yaml (с gitea_urls и draft) не приходится
# держать в двух вариантах.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'существующий тег, например v0.3.2'
        required: true

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.27.3'
  GORELEASER_VERSION: v2.20.0

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Сборка
        run: go build ./...
      # Бинарник goreleaser берём готовый и сверяем sha256: он собирается
      # тулчейном новее нашего.
      - name: Установить goreleaser
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}/goreleaser"
          mkdir -p "$tmp"
          base="https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}"
          file="goreleaser_Linux_x86_64.tar.gz"
          for i in 1 2 3; do
            if curl -sfL --retry 3 -o "$tmp/$file" "$base/$file" && curl -sfL --retry 3 -o "$tmp/checksums.txt" "$base/checksums.txt"; then
              break
            fi
            echo "скачивание goreleaser: попытка $i не удалась, повтор через 10с"; sleep 10
          done
          # Провал скачивания не должен превращаться в невнятную ошибку sha256sum.
          test -s "$tmp/$file" && test -s "$tmp/checksums.txt" || { echo "не удалось скачать goreleaser ${GORELEASER_VERSION}"; exit 1; }
          line=$(grep " $file\$" "$tmp/checksums.txt") || { echo "в checksums.txt нет строки $file"; exit 1; }
          printf '%s\n' "$line" | (cd "$tmp" && sha256sum -c -)
          tar -xzf "$tmp/$file" -C "$tmp" goreleaser
          echo "GORELEASER_BIN=$tmp/goreleaser" >> "$GITHUB_ENV"
      - name: Проверить конфиг goreleaser
        run: |
          set -euo pipefail
          if ! "$GORELEASER_BIN" check; then
            echo "goreleaser check: .goreleaser.yaml невалиден — релиз остановлен"
            exit 1
          fi
      - name: Собрать архивы
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          notes="${RUNNER_TEMP:-/tmp}/release-notes.md"
          bash scripts/release-notes.sh "$tag" > "$notes"
          "$GORELEASER_BIN" release --clean --skip=publish --release-notes "$notes"
      # Реестр Gitea закрыт, поэтому публичные образы живут в GHCR: с GitHub
      # их забирают без логина. Версия — без ведущего v, как у goreleaser.
      - name: Образы в GHCR
        env:
          IMAGE: ghcr.io/akrhin/mcprig
        run: |
          set -euo pipefail
          ver=$(printf '%s' "${{ inputs.tag || github.ref_name }}" | sed 's/^v//')
          revision=$(git rev-parse --short HEAD)
          printf '%s' "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for target in slim full; do
            case "$target" in full) latest=latest-full ;; *) latest=latest ;; esac
            docker build --target "$target" \
              --build-arg VERSION="$ver" --build-arg REVISION="$revision" \
              -t "$IMAGE:$ver-$target" -t "$IMAGE:$latest" .
            docker push "$IMAGE:$ver-$target"
            docker push "$IMAGE:$latest"
          done
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          notes="${RUNNER_TEMP:-/tmp}/release-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/checksums.txt --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes" \
              dist/*.tar.gz dist/checksums.txt
          fi
