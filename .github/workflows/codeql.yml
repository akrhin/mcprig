name: codeql
# Статический анализ безопасности от GitHub: Go и панель на JavaScript.
# Бесплатен для публичных репозиториев; результаты — в Security → Code scanning.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # еженедельно: новые правила приезжают без наших коммитов

permissions:
  contents: read

concurrency:
  group: mcprig-codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.4'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write # загрузка результатов анализа
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
