name: dependency-review
# Новые зависимости в PR: уязвимости, лицензии, свежесть. Public-репозиторий —
# бесплатно. Только чтение: комментарий в PR пишется через отдельное право,
# и оно здесь не нужно — красный статус объясняет сам себя.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
