# Что CodeQL не анализирует.
#
# docs/diagrams/** — выгрузки archify: .json правится руками, .html и .png
# генерируются, и правки в них всё равно затираются. design/ui/** — макеты и
# исследования интерфейса, не продукт. Остальные пути анализируются как есть:
# исключение шире находки прячет дефекты, а не шум.
paths-ignore:
  - docs/diagrams/**
  - design/ui/**
