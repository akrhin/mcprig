# Сборка релизов: один статичный бинарник на платформу.
# Проверка без публикации: goreleaser release --snapshot --clean
version: 2

before:
  hooks:
    - go vet ./...

builds:
  - id: mcprig
    main: ./cmd/mcprig
    binary: mcprig
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: mcprig
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.ru.md
      - LICENSE
      - deploy/mcprig-set@.service
      - deploy/mcprig.service

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # Черновик: артефакты загружены, публикация — вручную в интерфейсе Gitea.
  draft: true
  gitea:
    owner: sintez
    name: mcprig

# Без этого goreleaser не знает адрес инстанса: «failed to publish artifacts: invalid URL: ""».
gitea_urls:
  api: https://frosty-ad-gt.cloudpub.ru/api/v1
  download: https://frosty-ad-gt.cloudpub.ru
