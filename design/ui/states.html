<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcprig — состояния панели</title>
<style>
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-nowrap  { white-space: nowrap; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }

:root{
  --page:#06171C; --panel:#0B2229; --raised:#112E36; --border:#24505A;
  --text:#E6EFF1; --muted:#8CA6AE; --accent:#2BB3A3;
  --ok:#4FBE79; --warn:#D9A03C; --err:#F0808A;
  --hair:rgba(36,80,90,.5);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--text);
  font:12.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:1px solid var(--text);outline-offset:2px}
button{font:inherit;color:inherit}

/* sheet header */
.sheet{padding:14px 16px 0}
.sheet-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sheet-h h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.01em}
.sheet-h .meta{font-size:11px;color:var(--muted)}
.sheet p{margin:4px 0 0;font-size:11.5px;color:var(--muted);max-width:86ch}

/* board of shrink-wrapped panels */
.board{display:flex;align-items:flex-start;gap:16px;padding:14px 16px 20px;overflow-x:auto}
figure{margin:0;flex:none;min-width:0}
figcaption{display:flex;align-items:baseline;gap:8px;padding:0 0 6px}
.cap-h{font-size:11px;font-weight:600;letter-spacing:.02em}
.cap-n{font-size:10.5px;color:var(--muted)}
.panel{border:1px solid var(--border);background:var(--panel);overflow:hidden}
.panel-grid{display:grid;grid-template-columns:116px 240px}

/* rail */
.rail{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.rail-h{display:flex;align-items:center;justify-content:space-between;padding:9px 10px 8px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--hair)}
.setrow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 6px;padding:7px 10px 8px;border-bottom:1px solid var(--hair);color:var(--text);text-decoration:none}
.setrow.is-active{background:var(--raised)}
.setrow.is-active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.sname{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.sport{font-size:10px;color:var(--muted);align-self:center}
.srate{grid-column:1 / -1;font-size:10px;color:var(--muted)}
.rail-empty{padding:10px;font-size:11px;color:var(--muted)}
.rail-foot{margin-top:auto;border-top:1px solid var(--border);padding:7px 8px}
.rail-add{width:100%;text-align:left;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);padding:5px 7px;cursor:pointer;font-size:11px}
.rail-add:hover{background:var(--raised);color:var(--text)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.err{background:var(--err)}

/* content cell */
.pad{padding:11px 12px 13px;display:grid;gap:10px;min-width:0}
.ph{display:grid;gap:6px;min-width:0}
.title-row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
h2.t{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.port{font-size:11px;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}
code{font-family:var(--mono);font-size:10.5px;color:var(--text)}
.endpoint{display:flex;align-items:center;gap:6px;min-width:0}
.endpoint .lab{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.endpoint code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.primary{border-color:var(--accent);color:var(--accent)}
.btn.primary:hover{background:rgba(43,179,163,.1)}

/* empty state */
.empty{display:grid;gap:8px;padding:4px 0 2px}
.empty h3{font-size:12.5px;font-weight:600;margin:0}
.empty p{margin:0;font-size:11px;color:var(--muted);line-height:1.5}
.steps{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.steps li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px;font-size:10.5px;color:var(--muted)}
.steps .k{font-family:var(--mono);color:var(--muted);opacity:.7}

/* error strip */
.errstrip{border:1px solid var(--border);border-left:2px solid var(--err);padding:7px 8px;display:grid;gap:3px}
.errstrip .eh{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--err)}
.errstrip .ed{font-size:10.5px;color:var(--muted);line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stats .s{padding:7px 8px 8px 0;display:grid;gap:1px}
.stats .s + .s{border-left:1px solid var(--hair);padding-left:8px}
.stats .v{font-family:var(--mono);font-size:15px;line-height:1.15}
.stats .l{font-size:9.5px;color:var(--muted)}
.log{font-family:var(--mono);font-size:10px;line-height:1.5;display:grid;gap:1px}
.logline{display:grid;grid-template-columns:40px 30px minmax(0,1fr);gap:5px;min-width:0}
.logline .lt{color:var(--muted);opacity:.7}
.logline .lv{font-size:9px}
.logline .lv.info{color:var(--muted)}
.logline .lv.warn{color:var(--warn)}
.logline .lv.error{color:var(--err)}
.logline .lm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* dense table */
.dense{width:640px}
.dense .pane-h{display:flex;align-items:baseline;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.dense .pane-h h2{font-size:11.5px;font-weight:600;margin:0}
.dense .pane-h .meta{margin-left:auto;font-size:10.5px;color:var(--muted)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:11px}
table.t th{text-align:left;font-weight:500;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:4.5px 8px;border-bottom:1px solid var(--hair);vertical-align:middle;white-space:nowrap}
table.t tbody tr:last-child td{border-bottom:0}
.num{text-align:right}
td.num,th.num{font-family:var(--mono)}
.st{color:var(--muted)}
.st.bad{color:var(--err)}
.st.warnrow{color:var(--warn)}
tr.row-warn td:first-child{color:var(--warn)}
.slow{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="sheet">
  <div class="sheet-h">
    <h1>mcprig · состояния панели</h1>
    <span class="meta">1100 / 1440 / 375 — плотность сохраняется, панель остаётся инструментом</span>
  </div>
  <p>Три состояния одного экрана: первый запуск без наборов, остановленный набор с ошибкой прокси-пула, и вызовы под нагрузкой — сорок строк без потери читаемости.</p>
</div>

<div class="board">

  <!-- 1. EMPTY -->
  <figure>
    <figcaption><span class="cap-h">Пусто</span><span class="cap-n">нет наборов · первый запуск</span></figcaption>
    <div class="panel" style="width:356px">
      <div class="panel-grid">
        <nav class="rail" aria-label="Наборы — пусто">
          <div class="rail-h"><span>Наборы</span><span class="n">0</span></div>
          <div class="rail-empty">наборов нет</div>
          <div class="rail-foot"><button class="rail-add" type="button">+ набор</button></div>
        </nav>
        <div class="pad">
          <div class="ph">
            <h2 class="t">Нет наборов</h2>
            <span class="muted n" style="font-size:10.5px">демон слушает 127.0.0.1:9099</span>
          </div>
          <div class="empty">
            <h3>Соберите первый endpoint</h3>
            <p>Набор получает порт из 9100–9199, ключ и один MCP-адрес на все свои серверы.</p>
            <ul class="steps">
              <li><span class="k">1</span><span>Добавьте сервер: stdio-команда или streamable-http URL.</span></li>
              <li><span class="k">2</span><span>Создайте набор и назначьте ему серверы.</span></li>
              <li><span class="k">3</span><span>Скопируйте endpoint и ключ в клиент.</span></li>
            </ul>
          </div>
          <div><button class="btn primary" type="button">Создать набор</button></div>
        </div>
      </div>
    </div>
  </figure>

  <!-- 2. ERROR -->
  <figure>
    <figcaption><span class="cap-h">Набор остановлен</span><span class="cap-n">lab :9102 · процесс упал</span></figcaption>
    <div class="panel" style="width:356px">
      <div class="panel-grid">
        <nav class="rail" aria-label="Наборы — ошибка">
          <div class="rail-h"><span>Наборы</span><span class="n">3</span></div>
          <a class="setrow" href="#demo">
            <span class="sname"><span class="dot ok"></span><span class="od-truncate">demo</span></span>
            <span class="sport n">9100</span>
            <span class="srate"><span class="n">128</span> / ч</span>
          </a>
          <a class="setrow is-active" href="#lab" aria-current="true">
            <span class="sname"><span class="dot warn"></span><span class="od-truncate">lab</span></span>
            <span class="sport n">9102</span>
            <span class="srate"><span class="n">—</span> остановлен</span>
          </a>
          <a class="setrow" href="#dev">
            <span class="sname"><span class="dot ok"></span><span class="od-truncate">dev</span></span>
            <span class="sport n">9103</span>
            <span class="srate"><span class="n">41</span> / ч</span>
          </a>
          <div class="rail-foot"><button class="rail-add" type="button">+ набор</button></div>
        </nav>
        <div class="pad">
          <div class="ph">
            <div class="title-row">
              <h2 class="t">Набор lab</h2>
              <span class="port n">:9102</span>
              <span class="state"><span class="dot warn"></span>остановлен</span>
            </div>
            <div class="endpoint"><span class="lab">endpoint</span><code>127.0.0.1:9102/mcp</code></div>
          </div>
          <div class="errstrip">
            <div class="eh"><span class="dot err"></span>процесс завершился (code 1)</div>
            <div class="ed">memory: connection refused после 3 попыток · 21:03:39<br>автоперезапуск остановлен, чтобы не терять данные</div>
          </div>
          <div class="stats">
            <div class="s"><span class="v n">96</span><span class="l">вызовы 24 ч</span></div>
            <div class="s"><span class="v n">890 <span class="l" style="font-size:10px">мс</span></span><span class="l">p95</span></div>
            <div class="s"><span class="v n" style="color:var(--err)">6,1 <span class="l" style="font-size:10px">%</span></span><span class="l">ошибки</span></div>
          </div>
          <div class="log">
            <div class="logline"><span class="lt n">21:03:39</span><span class="lv error">ERROR</span><span class="lm">lab :9102 процесс завершился (code 1)</span></div>
            <div class="logline"><span class="lt n">21:03:39</span><span class="lv error">ERROR</span><span class="lm">memory: connection refused</span></div>
            <div class="logline"><span class="lt n">21:03:38</span><span class="lv warn">WARN</span><span class="lm">повтор 3/3 через 500 мс</span></div>
            <div class="logline"><span class="lt n">21:03:37</span><span class="lv warn">WARN</span><span class="lm">повтор 2/3 через 250 мс</span></div>
            <div class="logline"><span class="lt n">21:03:36</span><span class="lv info">INFO</span><span class="lm">health check 1/2 ok</span></div>
            <div class="logline"><span class="lt n">21:03:31</span><span class="lv info">INFO</span><span class="lm">listen lab :9102 · 2 сервера</span></div>
          </div>
          <div><button class="btn primary" type="button">Перезапустить</button></div>
        </div>
      </div>
    </div>
  </figure>

  <!-- 3. DENSE 40 ROWS -->
  <figure>
